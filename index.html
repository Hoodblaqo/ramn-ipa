<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090711">
<title>RAMNTIFY — Private IPA Access</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#33205c 0%,#151021 38%,#08070d 78%);color:#f7f3ff}
.wrap{width:min(100%,440px)}
.brand{display:flex;align-items:center;gap:13px;margin:0 0 28px}
.mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#c6a2ff,#8051d9);color:#160c27;font-size:20px;font-weight:950;box-shadow:0 8px 34px #9a69ff44}
.brand strong{display:block;font-size:15px;letter-spacing:3px}
.brand small{display:block;margin-top:4px;color:#9f92b8;font-size:9px;letter-spacing:2.2px}
.panel{padding:30px;border:1px solid #ffffff19;border-radius:24px;background:linear-gradient(155deg,#171222ee,#0e0b16f2);box-shadow:0 24px 90px #0009}
.eyebrow{font-size:10px;letter-spacing:3px;color:#b99aff;font-weight:800}
h1{font-size:32px;letter-spacing:-1.3px;margin:13px 0 9px}
.sub{color:#a99fb9;font-size:13px;line-height:1.7;margin:0 0 26px}
.field{display:flex;align-items:center;border:1px solid #3c3150;background:#0b0911;border-radius:12px;padding:0 15px;transition:.2s}
.field:focus-within{border-color:#a77aff;box-shadow:0 0 0 3px #a77aff22}
input{width:100%;background:none;border:0;outline:0;color:#fff;padding:16px 0;font-size:14px;letter-spacing:1px}
input::placeholder{color:#625873}
button,.download{width:100%;display:block;border:0;border-radius:12px;padding:16px;margin-top:13px;background:linear-gradient(110deg,#d3b6ff,#9a6aee);color:#1a1028;font-size:11px;font-weight:900;letter-spacing:1.8px;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.status{min-height:22px;margin-top:17px;font-size:12px;line-height:1.5;color:#9d91ad}
.status.good{color:#a8edc7}.status.bad{color:#ff9caa}
.download{display:none;background:#211735;border:1px solid #65499a;color:#e4d5ff}
.foot{display:flex;justify-content:space-between;margin-top:24px;color:#655b73;font-size:9px;letter-spacing:1.4px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#a77aff;margin-right:7px;box-shadow:0 0 10px #a77aff}
</style>
</head>
<body>
<main class="wrap">
<header class="brand"><div class="mark">R</div><div><strong>RAMNTIFY</strong><small>PRIVATE DOWNLOAD PORTAL</small></div></header>
<section class="panel">
<div class="eyebrow">ACCESS REQUIRED</div>
<h1>Enter the vault.</h1>
<p class="sub">Use your personal access code to unlock the private IPA download.</p>
<form id="form">
<div class="field"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ENTER ACCESS CODE" required></div>
<button id="submit" type="submit">VERIFY ACCESS&nbsp; ↗</button>
</form>
<div class="status" id="status" role="status">Your access code is verified securely by the RAMNTIFY server.</div>
<a class="download" id="download" href="#" target="_blank" rel="noopener">DOWNLOAD RAMNTIFY IPA ↓</a>
<div class="foot"><span><i class="dot"></i>SECURE GATE</span><span>RAMNTIFY / 2026</span></div>
</section>
</main>
<script>
const API_BASE="https://ramn-ipa-api.onrender.com";
const form=document.getElementById("form"),input=document.getElementById("code"),statusEl=document.getElementById("status"),btn=document.getElementById("submit"),download=document.getElementById("download");
form.addEventListener("submit",async e=>{
 e.preventDefault();download.style.display="none";statusEl.className="status";statusEl.textContent="Verifying access code…";btn.disabled=true;
 try{
  const r=await fetch(API_BASE+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:input.value.trim().toUpperCase()})});
  const d=await r.json();
  if(!r.ok||!d.ok){statusEl.className="status bad";statusEl.textContent=d.message||"Invalid access code.";return;}
  if(!d.downloadReady||!d.downloadUrl){statusEl.className="status good";statusEl.textContent="Code accepted. The IPA download is being configured.";return;}
  statusEl.className="status good";statusEl.textContent="Access granted. Your download is ready.";download.href=d.downloadUrl;download.style.display="block";
 }catch(_){statusEl.className="status bad";statusEl.textContent="Server unavailable. Please try again shortly.";}
 finally{btn.disabled=false;}
});
</script>
</body>
</html>
